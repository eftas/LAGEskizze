<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAGEkarte Simulation</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<style>
:root{--bg:#eef2f7;--panel:#fff;--ink:#0f172a;--muted:#475569;--line:#d5dde8;--accent:#1e40af;--ok:#15803d;--warn:#c2410c;--bad:#b91c1c}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:15px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}[hidden]{display:none!important}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#fff;border-bottom:2px solid var(--accent);min-height:56px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;color:#1e3a8a}header .sp{flex:1}
#clock{font:600 15px ui-monospace,Consolas,monospace}
#app{display:grid;grid-template-columns:430px 1fr;height:calc(100% - 58px)}
#app.big{grid-template-columns:0 1fr}#app.big #panel{visibility:hidden;overflow:hidden}
#panel{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:16px}
#mapWrap{position:relative;min-width:0}#map{position:absolute;inset:0;background:#dde3ea}
.btn{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 16px;border:2px solid #cbd5e1;border-radius:12px;background:#fff;font-weight:700;text-align:left}
.btn:hover{border-color:var(--accent)}.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}.btn.o{background:var(--warn);border-color:var(--warn);color:#fff}.btn.r{background:var(--bad);border-color:var(--bad);color:#fff}.btn.g{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{min-height:40px;padding:4px 12px;border-radius:8px;font-size:14px}.btn:disabled{opacity:.45;cursor:default}
.btn small{display:block;font-weight:400;font-size:12.5px;opacity:.85}
h2{font-size:21px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 14px;font-size:14px}.lbl{display:block;font-weight:700;font-size:14px;color:#334155;margin:14px 0 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{min-height:104px;flex-direction:column;align-items:flex-start;justify-content:space-between}
.ic{width:30px;height:30px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-weight:700;font-size:13.5px;white-space:nowrap}.ok{background:#dcfce7;color:#14532d}.wa{background:#fef3c7;color:#78350f}.bad{background:#fee2e2;color:#7f1d1d}.in{background:#dbeafe;color:#1e3a8a}.gr{background:#e2e8f0;color:#334155}
.dlg{position:fixed;inset:0;z-index:3000;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.4);max-height:94vh;overflow:auto;width:min(860px,100%)}
.card .bd{padding:18px 22px}.card .ft{display:flex;gap:10px;padding:14px 22px;background:#f1f5f9;position:sticky;bottom:0}
.steps{display:flex;gap:6px;padding:14px 22px 0}.steps i{flex:1;height:8px;border-radius:4px;background:#e2e8f0}.steps i.on{background:var(--accent)}
input[type=text],input[type=number],input[type=time],select,textarea{width:100%;min-height:50px;border:2px solid #94a3b8;border-radius:10px;padding:6px 12px;font:600 16px inherit;background:#fff;color:var(--ink)}textarea{min-height:90px}
table{border-collapse:collapse;width:100%}th{background:#e8eef7;text-align:left;padding:9px 10px;font-size:13.5px}td{padding:9px 10px;border-bottom:1px solid #e2e8f0}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}.kpi>div{background:#fff;border-radius:12px;padding:12px 14px;border-left:8px solid var(--c);box-shadow:0 1px 4px rgba(0,0,0,.15)}.kpi b{font-size:30px;display:block}
.bar{position:absolute;left:50%;transform:translateX(-50%);bottom:28px;z-index:900;display:flex;gap:8px;background:rgba(255,255,255,.97);padding:8px;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.bar .btn{flex-direction:column;justify-content:center;gap:2px;min-width:104px;min-height:70px;text-align:center;font-size:14px}
#band{position:absolute;left:64px;right:16px;top:12px;z-index:900;background:rgba(255,255,255,.97);border:1px solid #cbd5e1;border-top:6px solid #f97316;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.25);padding:8px 14px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
#band .nm{font-size:24px;font-weight:700}.plate{display:inline-flex;flex-direction:column;border:2px solid #000;background:#f97316;color:#000;font:700 14px/1.15 sans-serif;text-align:center;min-width:54px}.plate span{padding:2px 6px}.plate span:first-child{border-bottom:2px solid #000}
.tl{border-left:5px solid var(--c);padding:2px 10px}.tl b{display:block;font-size:19px}.tl span{font-size:12px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:10px;z-index:4000;font-weight:600;display:none}
.rolegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.ucard{display:flex;gap:12px;align-items:center;border:2px solid #cbd5e1;border-left:8px solid var(--c);border-radius:12px;background:#fff;padding:8px 12px;margin:8px 0;cursor:pointer;font-weight:700}
.ucard img{width:62px;height:44px;object-fit:contain;flex:none}.ucard small{display:block;font-weight:400;color:var(--muted)}
.org{display:flex;flex-direction:column;align-items:center;gap:0}.obox{border:2px solid #cbd5e1;border-top:6px solid var(--c);border-radius:8px;background:#fff;padding:8px 12px;display:flex;gap:10px;align-items:center;min-width:200px;text-align:left}.obox img{width:56px;height:40px;object-fit:contain}.obox small{display:block;color:var(--muted)}.vl{width:3px;height:18px;background:#94a3b8}
.eas{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;border-top:3px solid #94a3b8;padding-top:14px;margin-top:0}.ea{min-width:230px}
.cnt{display:flex;align-items:center;gap:12px;border:2px solid #cbd5e1;border-radius:12px;background:#fff;padding:8px 14px;margin:8px 0}.cnt img{width:54px;height:44px;object-fit:contain}.cnt b{font-size:28px;min-width:44px;text-align:center}.cnt span{flex:1;font-weight:700}
.roleinfo{font-size:13px;color:var(--muted)}
@media (max-width:860px){#app{grid-template-columns:1fr;grid-template-rows:auto 1fr}#panel{max-height:46vh}#mapWrap{min-height:50vh}}
</style>
</head>
<body>
<header><h1>LAGEkarte Simulation</h1><span class="chip in" id="roleChip" hidden></span><span class="sp"></span><span id="clock"></span>
<button class="btn sm" id="btnBig" hidden>Karte groß</button><button class="btn sm" id="btnExport" hidden>Meine Daten exportieren (JSON)</button><button class="btn sm" id="btnRole" hidden>Rolle wechseln</button></header>
<div id="app" hidden><aside id="panel"></aside><div id="mapWrap"><div id="map"></div><div id="band" hidden></div><div class="bar" id="bar" hidden></div></div></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<script>/*ASSETS*/</script>
<script>
(function(){'use strict';
const A=window.ASSETS||{};const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);const now=()=>Date.now();
const hm=t=>new Date(t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
const dur=ms=>{const m=Math.round(ms/60000),h=Math.floor(m/60);return h?h+' h '+String(m%60).padStart(2,'0')+' min':m+' min';};
const IC={
plus:'<svg class="ic" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="currentColor" opacity=".15"/><path d="M16 8v16M8 16h16" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" fill="none"/></svg>',
flask:'<svg class="ic" viewBox="0 0 32 32"><path d="M12 4h8M14 4v8L6 26a2 2 0 0 0 2 3h16a2 2 0 0 0 2-3l-8-14V4" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/></svg>',
doc:'<svg class="ic" viewBox="0 0 32 32"><path d="M8 3h12l6 6v20H8zM20 3v6h6M12 15h10M12 20h10" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/></svg>',
clock:'<svg class="ic" viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" stroke="currentColor" stroke-width="2.6" fill="none"/><path d="M16 9v8l5 3" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>',
users:'<svg class="ic" viewBox="0 0 32 32"><circle cx="12" cy="11" r="4.5" stroke="currentColor" stroke-width="2.4" fill="none"/><path d="M3 27c0-6 4-9 9-9s9 3 9 9M22 8a4 4 0 0 1 0 8M26 26c0-4-1.5-6.5-4-8" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>',
org:'<svg class="ic" viewBox="0 0 32 32"><rect x="11" y="3" width="10" height="7" rx="1.5" stroke="currentColor" stroke-width="2.4" fill="none"/><rect x="2" y="22" width="9" height="7" rx="1.5" stroke="currentColor" stroke-width="2.4" fill="none"/><rect x="21" y="22" width="9" height="7" rx="1.5" stroke="currentColor" stroke-width="2.4" fill="none"/><path d="M16 10v6M6 22v-6h20v6" stroke="currentColor" stroke-width="2.4" fill="none"/></svg>',
map:'<svg class="ic" viewBox="0 0 32 32"><path d="M3 8l8-3 10 3 8-3v19l-8 3-10-3-8 3zM11 5v19M21 8v19" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linejoin="round"/></svg>',
radio:'<svg class="ic" viewBox="0 0 32 32"><path d="M9 12h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V14a2 2 0 0 1 2-2zM13 12V4M10 18h12M10 23h8" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>',
up:'<svg class="ic" viewBox="0 0 32 32"><path d="M16 22V6M9 13l7-7 7 7M5 27h22" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
truck:'<svg class="ic" viewBox="0 0 32 32"><path d="M2 8h18v14H2zM20 13h6l4 5v4H20zM8 26a3 3 0 1 0 0-.1M25 26a3 3 0 1 0 0-.1" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linejoin="round"/></svg>'};
/* ---- Rollen und Datenbereiche ---- */
const ROLES=[{id:'EL',name:'Einsatzleiter',d:'Gesamtlage, Führungsstruktur'},{id:'S1',name:'S1 Personal',d:'Personen erfassen (SK, Tote, Vermisste)'},{id:'S2',name:'S2 Lage',d:'Lagevortrag, Daten der anderen einlesen'},{id:'S3',name:'S3 Einsatz',d:'Einheiten und Abschnitte'},{id:'S4',name:'S4 Versorgung',d:'Ablösung, Atemschutz, Nachforderung, Ausfälle'},{id:'S5',name:'S5 Presse',d:'Meldungen'},{id:'S6',name:'S6 Kommunikation',d:'Kommunikationsplan'}];
const DOM={EL:['people'],S1:['persons'],S2:['chem','wind'],S3:['units','sections'],S4:['logi'],S5:['messages'],S6:['komm']};
const STAT=[{id:'bereit',t:'Einsatzbereit',c:'#15803d'},{id:'anfahrt',t:'Anfahrt',c:'#2563eb'},{id:'einsatz',t:'Im Einsatz',c:'#b91c1c'},{id:'pause',t:'Pause, Ablösung',c:'#b45309'}];
const stat=id=>STAT.find(s=>s.id===id)||STAT[0];
const VEH=[{id:'LF20',t:'Löschfahrzeug LF 20',n:'LF 20',s:'FW_LF20'},{id:'HLF20',t:'Hilfeleistungs-LF',n:'HLF 20',s:'FW_HLF20'},{id:'DLK',t:'Drehleiter',n:'DLK 23',s:'FW_DLK'},{id:'ELW1',t:'Einsatzleitwagen',n:'ELW 1',s:'FW_ELW1'},{id:'GW',t:'Gerätewagen',n:'GW-G',s:'FW_GW-G'},{id:'RW',t:'Rüstwagen',n:'RW 2',s:'FW_RW'}];
const PERS=[['betroffen','Betroffene','betroffene'],['sk1','SK I (rot)','sk1'],['sk2','SK II (gelb)','sk2'],['sk3','SK III (grün)','sk3'],['tot','Tote','tot'],['vermisst','Vermisste','vermisst']];
const P0={lat:50.9290,lng:6.9380};
const SUB={benzol:{name:'Benzol',un:'1114',kemler:'33',cas:'71-43-2',flash:'−11 °C',ex:'1,2 bis 8,6 Vol.-%',vd:'2,7 (schwerer als Luft)',h:'H350 krebserzeugend',erg:{a:50,b:300,c:800},ghs:['GHS02','GHS08','GHS07']}};
const sym=n=>A[n]||'';
function demo(){const t=now(),L=m=>new Date(t+m*60000).toISOString();
 const mk=(id,v,call,st,sec,f,u,h,task,la,ln)=>({id,vid:v,name:VEH.find(x=>x.id===v).n,call,sym:VEH.find(x=>x.id===v).s,f,u,h,status:st,sec,task,lat:P0.lat+la,lng:P0.lng+ln});
 return{sections:[{id:'a1',name:'EA Nord',leader:'B. Beispiel',radio:'Kanal 3'},{id:'a2',name:'EA Süd',leader:'C. Muster',radio:'Kanal 4'},{id:'a3',name:'Bereitstellung',leader:'',radio:'Kanal 5'}],
 units:[mk('u1','LF20','Florian 1/42','einsatz','a1',1,1,7,'Brandbekämpfung',.0016,-.0012),mk('u2','HLF20','Florian 1/46','einsatz','a1',1,1,4,'Menschenrettung',.0022,.0004),mk('u3','DLK','Florian 1/33','anfahrt','a2',1,1,1,'Riegelstellung',-.0016,.0022),mk('u4','RW','Florian 1/52','bereit','a3',1,2,3,'Reserve',-.0026,-.0016)],
 logi:{u1:{since:L(-130),relief:L(25),agtN:3,agtMin:20,gebunden:9,verf:0,res:0,req:'',eta:'',bereit:'',ausfall:''},u2:{since:L(-125),relief:L(0),agtN:2,agtMin:45,gebunden:6,verf:0,res:0,req:'',eta:'',bereit:'',ausfall:''},u3:{since:'',relief:'',agtN:0,agtMin:0,gebunden:0,verf:3,res:0,req:'Drehleiter angefordert',eta:L(6),bereit:'BR Süd',ausfall:''},u4:{since:'',relief:'',agtN:0,agtMin:0,gebunden:0,verf:0,res:6,req:'',eta:'',bereit:'BR Süd',ausfall:'Pumpe defekt'}},
 persons:{betroffen:12,sk1:2,sk2:3,sk3:5,tot:0,vermisst:1},chem:{sid:'benzol',lat:P0.lat,lng:P0.lng,large:true,fire:false},wind:{dir:157,speed:3},
 messages:[{id:'m1',t:L(-20),from:'S5',text:'Presseanfrage der Lokalzeitung, Rückruf nach der Lagebesprechung.'}],
 komm:[{id:'k1',med:'Funk',ch:'Kanal 1',use:'Führung',who:'EL, Stab'},{id:'k2',med:'Funk',ch:'Kanal 3',use:'EA Nord',who:'Florian 1/42, Florian 1/46'},{id:'k3',med:'Telefon',ch:'0221 000 000',use:'Leitstelle',who:'S2, S6'}],
 people:{EL:{name:'H. Beispielleitung',call:'Florian Köln 1'},SL:{name:'J. Stabsmuster',call:''},LS:{name:'',call:''}},sources:{}};}
let role=null,S=null,map=null,layer=null,pickMode=null;
const keyOf=r=>'lksim-'+r;
function save(){if(role)try{localStorage.setItem(keyOf(role),JSON.stringify(S));}catch(e){}}
function load(r){try{const j=localStorage.getItem(keyOf(r));if(j)return JSON.parse(j);}catch(e){}return demo();}
const own=k=>DOM[role]&&DOM[role].some(d=>d===k);
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3200);}
function dlg(html,cls){const d=document.createElement('div');d.className='dlg';d.innerHTML='<div class="card '+(cls||'')+'">'+html+'</div>';d.addEventListener('mousedown',e=>{if(e.target===d)d.remove();});document.body.append(d);d.close=()=>d.remove();return d;}
/* ---- Start: Rollenwahl ---- */
function chooser(){role=null;$('#app').hidden=true;['roleChip','btnBig','btnExport','btnRole'].forEach(i=>$('#'+i).hidden=true);
 const d=dlg('<div class="bd"><h2>Wer sind Sie?</h2><p class="sub">Sie sehen danach nur die Aufgaben Ihrer Funktion. Ihre Eingaben bleiben auf diesem Gerät, bis Sie sie exportieren.</p><div class="rolegrid">'+ROLES.map(r=>'<button class="btn tile'+(r.id==='S2'?' p':'')+'" data-r="'+r.id+'"><span style="font-size:20px">'+r.name+'</span><small>'+r.d+'</small></button>').join('')+'</div><p class="roleinfo" style="margin-top:14px">Zum Ausprobieren: als S3 eine Einheit melden und exportieren, dann als S2 die Datei einlesen. <a href="#" id="rst">Alle Simulationsdaten zurücksetzen</a></p></div>','');
 d.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(b){d.close();start(b.dataset.r);}if(e.target.id==='rst'){e.preventDefault();ROLES.forEach(r=>localStorage.removeItem(keyOf(r.id)));toast('Zurückgesetzt.');}});}
function start(r){role=r;S=load(r);$('#app').hidden=false;['roleChip','btnBig','btnExport','btnRole'].forEach(i=>$('#'+i).hidden=false);$('#roleChip').textContent=ROLES.find(x=>x.id===r).name;
 if(!map){map=L.map('map',{zoomControl:true}).setView([P0.lat,P0.lng],16);const t=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri, HERE, Garmin, OpenStreetMap-Mitwirkende'}).addTo(map);layer=L.layerGroup().addTo(map);
  map.on('click',e=>{if(pickMode){const f=pickMode;pickMode=null;$('#map').style.cursor='';f(e.latlng);}});}
 setTimeout(()=>map.invalidateSize(),50);home();draw();}
/* ---- Karte ---- */
const R=6371000,rad=x=>x*Math.PI/180,deg=x=>x*180/Math.PI;
function dest(lat,lng,br,d){const a=d/R,p1=rad(lat),l1=rad(lng),b=rad(br);const p2=Math.asin(Math.sin(p1)*Math.cos(a)+Math.cos(p1)*Math.sin(a)*Math.cos(b));const l2=l1+Math.atan2(Math.sin(b)*Math.sin(a)*Math.cos(p1),Math.cos(a)-Math.sin(p1)*Math.sin(p2));return[deg(p2),deg(l2)];}
function draw(){if(!layer)return;layer.clearLayers();
 const c=S.chem;if(c){const s=SUB[c.sid],to=(S.wind.dir+180)%360;
  if(c.fire)L.circle([c.lat,c.lng],{radius:s.erg.c,color:'#7c2d12',weight:2,dashArray:'8 6',fillOpacity:.05}).addTo(layer);
  if(c.large){const pts=[[c.lat,c.lng]];for(let a=-30;a<=30;a+=3)pts.push(dest(c.lat,c.lng,to+a,s.erg.b));L.polygon(pts,{color:'#ea580c',weight:2,fillColor:'#fb923c',fillOpacity:.3}).addTo(layer);}
  L.circle([c.lat,c.lng],{radius:s.erg.a,color:'#b91c1c',weight:2.5,fillColor:'#ef4444',fillOpacity:.45}).addTo(layer);
  L.marker([c.lat,c.lng],{icon:L.divIcon({className:'',iconSize:[56,44],iconAnchor:[28,22],html:'<div class="plate"><span>'+s.kemler+'</span><span>'+s.un+'</span></div>'})}).addTo(layer);}
 S.units.forEach(u=>{if(u.lat==null)return;const st=stat(u.status);
  L.marker([u.lat,u.lng],{icon:L.divIcon({className:'',iconSize:[90,56],iconAnchor:[45,28],html:'<div style="text-align:center"><img src="'+sym(u.sym)+'" style="width:60px;height:38px;object-fit:contain;filter:drop-shadow(0 1px 2px #fff)"><div style="font:700 11px sans-serif;background:#fff;border:2px solid '+st.c+';border-radius:4px;padding:0 4px;display:inline-block">'+esc(u.name)+'</div></div>'})}).on('click',()=>unitCard(u.id)).addTo(layer);});
 band();bar();}
function band(){const b=$('#band'),c=S.chem;if(!c){b.hidden=true;return;}const s=SUB[c.sid];
 b.innerHTML='<div class="plate" style="transform:scale(1.2);margin:0 8px"><span>'+s.kemler+'</span><span>'+s.un+'</span></div><div><div class="nm">'+s.name+'</div><div style="font-size:12px;color:#475569">CAS '+s.cas+' · Klasse 3 · ERG 130</div></div><div style="display:flex;gap:6px">'+s.ghs.map(g=>'<img src="'+sym(g)+'" style="height:44px">').join('')+'</div>'
  +'<div class="tl" style="--c:#ea580c"><b>'+s.flash+'</b><span>Flammpunkt</span></div><div class="tl" style="--c:#ea580c"><b>'+s.ex+'</b><span>Zündbereich</span></div><div class="tl" style="--c:#0e7490"><b>2,7</b><span>Dampfdichte, schwerer als Luft</span></div><div class="tl" style="--c:#7f1d1d"><b>H350</b><span>krebserzeugend</span></div>'
  +'<div style="margin-left:auto;font-size:13px;line-height:1.6"><span style="color:#ef4444">■</span> '+s.erg.a+' m Absperrung'+(c.large?'<br><span style="color:#ea580c">■</span> '+s.erg.b+' m Windrichtung':'')+(c.fire?'<br><span style="color:#7c2d12">■</span> '+s.erg.c+' m Brand':'')+'</div>';b.hidden=false;}
/* ---- Aufgaben je Rolle (Entwurf 1 und 6) ---- */
const TILES={

/* ---- Export und Einlesen ---- */
function pick(keys,src){const o={};keys.forEach(k=>{o[k]=src[k];});return o;}
function exportMine(all){const keys=all?Object.values(DOM).flat():DOM[role];const data={format:'lagekarte-simulation',version:1,role:all?'Gesamt':role,exported:new Date().toISOString(),data:pick(keys,S)};
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}));a.download='lagekarte-'+(all?'gesamt':role)+'-'+hm(now()).replace(':','')+'.json';document.body.append(a);a.click();a.remove();toast((all?'Gesamtstand':'Ihre Daten ('+role+')')+' exportiert.');}
function importDlg(){const d=dlg('<div class="bd"><h2>Daten der anderen einlesen</h2><p class="sub">Alle JSON-Dateien auf einmal wählen. Jede Datei ersetzt den Bereich ihrer Funktion, wenn sie neuer ist als der vorhandene Stand. Ihre Karte wird sofort aktualisiert.</p><label class="btn p" style="justify-content:center;cursor:pointer">Dateien wählen<input type="file" id="fi" accept=".json,application/json" multiple hidden></label><div id="res"></div><span class="lbl">Eingegangen</span><div id="src"></div></div><div class="ft"><button class="btn" data-x style="justify-content:center">Schließen</button><button class="btn sm" id="ex" style="margin-left:auto">Gesamtstand exportieren</button></div>');
 const show=()=>{$('#src',d).innerHTML=Object.keys(DOM).filter(k=>k!=='S2').map(k=>{const s=S.sources[k];return '<div style="display:flex;gap:10px;align-items:center;margin:6px 0"><b style="width:46px">'+k+'</b>'+(s?'<span class="chip ok">Stand '+hm(s.time)+'</span><span>'+esc(s.file)+'</span>':'<span class="chip gr">noch nichts eingegangen</span>')+'</div>';}).join('');};show();
 d.addEventListener('click',e=>{if(e.target.hasAttribute('data-x'))d.close();if(e.target.id==='ex')exportMine(true);});
 $('#fi',d).onchange=async e=>{const out=[];for(const f of e.target.files){try{const j=JSON.parse(await f.text());if(j.format!=='lagekarte-simulation'||!DOM[j.role])throw new Error('keine LAGEkarte-Datei');const t=Date.parse(j.exported);const cur=S.sources[j.role];
   if(cur&&cur.time>=t){out.push(['gr',f.name,'älter oder gleich, übersprungen']);continue;}
   DOM[j.role].forEach(k=>{if(j.data[k]!==undefined)S[k]=j.data[k];});S.sources[j.role]={time:t,file:f.name};out.push(['ok',f.name,'übernommen als '+j.role]);}catch(err){out.push(['bad',f.name,'nicht lesbar: '+err.message]);}}
  $('#res',d).innerHTML=out.map(o=>'<div style="margin:6px 0"><span class="chip '+o[0]+'">'+esc(o[2])+'</span> '+esc(o[1])+'</div>').join('');save();draw();show();toast(out.filter(o=>o[0]==='ok').length+' Dateien übernommen. Karte aktualisiert.');e.target.value='';};}

 const d=dlg('');const render=()=>{const c=$('.card',d);
  const stp='<div class="steps">'+[1,2,3].map(i=>'<i class="'+(i<=step?'on':'')+'"></i>').join('')+'</div>';let body='',ft='';
  if(step===1){body='<h2>Welche Einheit kommt dazu?</h2><p class="sub">Schritt 1 von 3. Eine Fahrzeugart antippen.</p><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">'+VEH.map(x=>'<button class="btn" data-v="'+x.id+'" style="flex-direction:column;justify-content:center;min-height:120px;'+(v===x.id?'border-color:#1e40af;background:#e8eefb':'')+'"><img src="'+sym(x.s)+'" style="height:58px;width:100%;object-fit:contain"><span>'+x.t+'</span></button>').join('')+'</div>';ft='<button class="btn" data-x style="min-width:140px;justify-content:center">Abbrechen</button><button class="btn p" data-n style="margin-left:auto;min-width:200px;justify-content:center" '+(v?'':'disabled')+'>Weiter</button>';}
  if(step===2){const vh=VEH.find(x=>x.id===v);if(!nm)nm=vh.n;if(!call)call='Florian 1/'+(20+Math.floor(Math.random()*60));
   body='<h2>Wohin und in welchem Zustand?</h2><p class="sub">Schritt 2 von 3.</p><span class="lbl">Abschnitt</span><div style="display:flex;gap:8px;flex-wrap:wrap">'+S.sections.map(s=>'<button class="btn" data-s="'+s.id+'" style="'+(sec===s.id?'border-color:#1e40af;background:#e8eefb':'')+'">'+esc(s.name)+'</button>').join('')+'<button class="btn" data-s="" style="'+(sec===''?'border-color:#1e40af;background:#e8eefb':'')+'">noch offen</button></div><span class="lbl">Zustand</span><div style="display:flex;gap:8px;flex-wrap:wrap">'+STAT.map(s=>'<button class="btn" data-t="'+s.id+'" style="'+(st===s.id?'border-color:'+s.c+';background:'+s.c+';color:#fff':'')+'">'+s.t+'</button>').join('')+'</div><span class="lbl">Bezeichnung und Funkrufname</span><div class="grid2"><input type="text" id="nm" value="'+esc(nm)+'"><input type="text" id="cl" value="'+esc(call)+'"></div>';
   ft='<button class="btn" data-b style="min-width:140px;justify-content:center">Zurück</button><button class="btn p" data-n style="margin-left:auto;min-width:200px;justify-content:center" '+(sec===null?'disabled':'')+'>Weiter</button>';}
  if(step===3){body='<h2>Wo steht die Einheit?</h2><p class="sub">Schritt 3 von 3. Danach auf die Karte tippen.</p><div class="btn" style="justify-content:center;min-height:90px;border-style:dashed">Fenster schließt, dann auf die Karte tippen</div>';ft='<button class="btn" data-b style="min-width:140px;justify-content:center">Zurück</button><button class="btn" data-o style="margin-left:auto;justify-content:center">Ohne Ort speichern</button><button class="btn p" data-m style="min-width:200px;justify-content:center">Ort auf Karte wählen</button>';}
  c.innerHTML=stp+'<div class="bd">'+body+'</div><div class="ft">'+ft+'</div>';};
 const fin=ll=>{const vh=VEH.find(x=>x.id===v);S.units.push({id:uid(),vid:v,name:$('#nm')?.value||nm,call,sym:vh.s,f:1,u:1,h:6,status:st,sec:sec||null,task:'',lat:ll?ll.lat:null,lng:ll?ll.lng:null});S.logi[S.units[S.units.length-1].id]={since:st==='einsatz'?new Date().toISOString():'',relief:'',agtN:0,agtMin:0,gebunden:0,verf:0,res:0,req:'',eta:'',bereit:'',ausfall:''};save();draw();toast('Einheit '+nm+' gemeldet.');};
 d.addEventListener('click',e=>{const t=e.target.closest('button,[data-x]');if(!t)return;
  if(t.hasAttribute('data-x'))d.close();else if(t.dataset.v){v=t.dataset.v;nm='';call='';render();}else if(t.dataset.s!==undefined&&t.hasAttribute('data-s')){nm=$('#nm').value;call=$('#cl').value;sec=t.dataset.s;render();}else if(t.dataset.t){nm=$('#nm').value;call=$('#cl').value;st=t.dataset.t;render();}
  else if(t.hasAttribute('data-n')){if(step===2){nm=$('#nm').value;call=$('#cl').value;}step++;render();}else if(t.hasAttribute('data-b')){if(step===2){nm=$('#nm').value;call=$('#cl').value;}step--;render();}
  else if(t.hasAttribute('data-o')){nm=nm||'';fin(null);d.close();home();}else if(t.hasAttribute('data-m')){const n2=nm;d.close();pickMode=ll=>{nm=n2;fin(ll);home();};$('#map').style.cursor='crosshair';toast('Ort der Einheit auf der Karte antippen.');}});
 render();}
function unitList(logiMode){$('#panel').onclick=defClick;const by=S.sections.concat([{id:'',name:'noch ohne Abschnitt'}]);
 $('#panel').innerHTML='<button class="btn sm" id="bk">‹ Zurück</button><h2 style="margin-top:12px">'+(logiMode?'Versorgung je Einheit':'Einheiten')+'</h2><p class="sub">Eine Einheit antippen.'+(own('units')?' Sie dürfen Status, Abschnitt und Auftrag ändern.':' Nur ansehen.')+'</p>'
 +by.map(s=>{const us=S.units.filter(u=>(u.sec||'')===s.id);if(!us.length&&!s.id)return '';return '<span class="lbl">'+esc(s.name)+(s.leader?' · Leiter '+esc(s.leader):'')+'</span>'+(us.length?us.map(u=>'<div class="ucard" data-u="'+u.id+'" style="--c:'+stat(u.status).c+'"><img src="'+sym(u.sym)+'"><div>'+esc(u.name)+'<small>'+esc(u.call)+' · '+stat(u.status).t+(S.logi[u.id]&&S.logi[u.id].ausfall?' · AUSFALL':'')+'</small></div></div>').join(''):'<div class="sub">leer</div>');}).join('');
 $('#bk').onclick=home;}
function unitCard(id){const u=S.units.find(x=>x.id===id);if(!u)return;const edit=own('units'),ed4=own('logi'),lg=S.logi[id]||(S.logi[id]={since:'',relief:'',agtN:0,agtMin:0,gebunden:0,verf:0,res:0,req:'',eta:'',bereit:'',ausfall:''});let more=ed4;
 const d=dlg('');const render=()=>{const t=h=>'<div class="sel" style="border:2px solid #94a3b8;border-radius:10px;padding:12px;font-weight:600">'+h+'</div>';
  const tm=v=>v?hm(Date.parse(v)):'–';
  $('.card',d).innerHTML='<div class="bd"><div style="display:flex;align-items:center;gap:14px"><img src="'+sym(u.sym)+'" style="height:64px;width:90px;object-fit:contain"><div><h2 style="margin:0">'+esc(u.name)+'</h2><div class="sub" style="margin:0">'+esc(u.call)+' · Stärke '+u.f+'/'+u.u+'/'+u.h+'/'+(u.f+u.u+u.h)+'</div></div></div>'
  +'<span class="lbl">Was macht die Einheit gerade?</span><div class="grid2">'+STAT.map(s=>'<button class="btn" data-t="'+s.id+'" '+(edit?'':'disabled')+' style="justify-content:center;'+(u.status===s.id?'background:'+s.c+';border-color:'+s.c+';color:#fff':'')+'">'+s.t+'</button>').join('')+'</div>'
  +'<span class="lbl">Wo ist sie eingesetzt?</span><select id="sc" '+(edit?'':'disabled')+'><option value="">noch offen</option>'+S.sections.map(s=>'<option value="'+s.id+'" '+(u.sec===s.id?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select>'
  +'<span class="lbl">Auftrag</span><input type="text" id="tk" value="'+esc(u.task)+'" '+(edit?'':'disabled')+' placeholder="z. B. Menschenrettung, 2. OG">'
  +(more?'<span class="lbl">Einsatzdauer und Ablösung</span><div class="grid2"><div><small>Seit (Uhrzeit)</small><input type="time" id="sn" value="'+(lg.since?hm(Date.parse(lg.since)):'')+'" '+(ed4?'':'disabled')+'></div><div><small>Ablösung um</small><input type="time" id="rl" value="'+(lg.relief?hm(Date.parse(lg.relief)):'')+'" '+(ed4?'':'disabled')+'></div></div>'
   +'<span class="lbl">Atemschutz</span><div class="grid2"><div><small>Geräteträger</small><input type="number" id="an" min="0" value="'+lg.agtN+'" '+(ed4?'':'disabled')+'></div><div><small>Minuten im Einsatz</small><input type="number" id="am" min="0" value="'+lg.agtMin+'" '+(ed4?'':'disabled')+'></div></div>'
   +'<span class="lbl">Stärke</span><div class="grid2" style="grid-template-columns:repeat(3,1fr)"><div><small>Gebunden</small><input type="number" id="gb" min="0" value="'+lg.gebunden+'" '+(ed4?'':'disabled')+'></div><div><small>Verfügbar</small><input type="number" id="vf" min="0" value="'+lg.verf+'" '+(ed4?'':'disabled')+'></div><div><small>Reserve</small><input type="number" id="rs" min="0" value="'+lg.res+'" '+(ed4?'':'disabled')+'></div></div>'
   +'<span class="lbl">Nachforderung</span><div class="grid2"><input type="text" id="rq" value="'+esc(lg.req)+'" placeholder="Was wird angefordert?" '+(ed4?'':'disabled')+'><input type="time" id="et" value="'+(lg.eta?hm(Date.parse(lg.eta)):'')+'" '+(ed4?'':'disabled')+'></div>'
   +'<span class="lbl">Bereitstellungsraum</span><input type="text" id="br" value="'+esc(lg.bereit)+'" '+(ed4?'':'disabled')+'><span class="lbl">Ausfall</span><input type="text" id="af" value="'+esc(lg.ausfall)+'" placeholder="leer = kein Ausfall" '+(ed4?'':'disabled')+'>'
   :'<button class="btn" id="mo" style="margin-top:14px;border-style:dashed;justify-content:center">Weitere Angaben zeigen (Dauer, Atemschutz, Nachforderung, Ausfall)</button>')+'</div>'
  +'<div class="ft">'+(edit?'<button class="btn r sm" data-del>Entfernen</button>':'')+'<button class="btn p" data-ok style="flex:1;justify-content:center">Fertig</button></div>';};
 const grab=()=>{const g=i=>$(i,d);if(edit){u.sec=g('#sc').value||null;u.task=g('#tk').value;}if(ed4&&g('#an')){const tt=v=>{if(!v)return '';const[h,m]=v.split(':');const x=new Date();x.setHours(+h,+m,0,0);return x.toISOString();};Object.assign(lg,{since:tt(g('#sn').value),relief:tt(g('#rl').value),agtN:+g('#an').value||0,agtMin:+g('#am').value||0,gebunden:+g('#gb').value||0,verf:+g('#vf').value||0,res:+g('#rs').value||0,req:g('#rq').value,eta:tt(g('#et').value),bereit:g('#br').value,ausfall:g('#af').value});}};
 d.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.t){grab();u.status=t.dataset.t;if(u.status==='einsatz'&&!lg.since)lg.since=new Date().toISOString();save();draw();render();}else if(t.id==='mo'){grab();more=true;render();}else if(t.hasAttribute('data-ok')){grab();save();draw();d.close();if($('#panel .ucard'))unitList(); }else if(t.hasAttribute('data-del')){if(confirm('Einheit '+u.name+' entfernen?')){S.units=S.units.filter(x=>x!==u);delete S.logi[u.id];save();draw();d.close();unitList();}}});render();}

/* ---- Führung (Entwurf FwDV 100) ---- */
function org(){const edit=own('people');const P=S.people;const box=(c,img,t,n,id)=>'<div class="obox" style="--c:'+c+';'+(edit&&id?'cursor:pointer':'')+'" '+(id?'data-p="'+id+'"':'')+'><img src="'+sym(img)+'"><div><b>'+t+'</b><small>'+(n||'unbesetzt')+'</small></div></div>';
 $('#panel').innerHTML='<button class="btn sm" id="bk">‹ Zurück</button><h2 style="margin-top:12px">Führungsstruktur</h2><p class="sub">'+(edit?'Ein Feld antippen, um jemanden einzutragen.':'Nur ansehen.')+'</p><div class="org">'+box('#0f2a47','T_EL','Einsatzleiter',P.EL.name,'EL')+'<div class="vl"></div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">'+box('#1e40af','T_Stab','Führungsstab',P.SL.name,'SL')+box('#475569','T_LSt','Leitstelle',P.LS.name,'LS')+'</div><div class="vl"></div><div class="eas">'+S.sections.map(s=>'<div class="ea">'+box('#2563eb','T_EAL',esc(s.name),s.leader)+S.units.filter(u=>u.sec===s.id).map(u=>'<div class="ucard" data-u="'+u.id+'" style="--c:'+stat(u.status).c+'"><img src="'+sym(u.sym)+'"><div>'+esc(u.name)+'<small>'+stat(u.status).t+'</small></div></div>').join('')+'</div>').join('')+'</div></div>';
 $('#bk').onclick=home;$('#panel').onclick=e=>{const u=e.target.closest('[data-u]');if(u)return unitCard(u.dataset.u);const b=e.target.closest('[data-p]');if(b&&edit){const id=b.dataset.p;const v=prompt('Name und Funktion eintragen',P[id].name||'');if(v!==null){P[id].name=v.trim();save();org();}}};}
/* ---- Gefahrstoff (S2) ---- */
function chemDlg(){const edit=own('chem'),c=S.chem,s=SUB.benzol;
 const d=dlg('<div class="bd"><h2>Gefahrstoff</h2>'+(c?'<div style="display:flex;gap:14px;align-items:center"><div class="plate" style="transform:scale(1.2);margin:0 10px"><span>'+s.kemler+'</span><span>'+s.un+'</span></div><div><b style="font-size:20px">'+s.name+'</b><div class="sub" style="margin:0">CAS '+s.cas+' · Flammpunkt '+s.flash+' · Zündbereich '+s.ex+'</div></div></div><div style="display:flex;gap:8px;margin:10px 0">'+s.ghs.map(g=>'<img src="'+sym(g)+'" style="height:50px">').join('')+'</div>'
  +'<span class="lbl">Zonen auf der Karte</span><label class="btn" style="margin:6px 0"><input type="checkbox" checked disabled> '+s.erg.a+' m Absperrung rundum</label><label class="btn" style="margin:6px 0"><input type="checkbox" id="cl" '+(c.large?'checked':'')+' '+(edit?'':'disabled')+'> Großes Leck: '+s.erg.b+' m in Windrichtung</label><label class="btn" style="margin:6px 0"><input type="checkbox" id="cf" '+(c.fire?'checked':'')+' '+(edit?'':'disabled')+'> Behälterbrand: '+s.erg.c+' m rundum</label><p class="sub">Werte nach ERG 2024, Leitfaden 130, und GESTIS. Beispieldaten der Simulation.</p>':'<p class="sub">Noch kein Gefahrstoff gemeldet.</p>')+'</div><div class="ft"><button class="btn" data-x>Schließen</button>'+(edit?(c?'<button class="btn r" data-rm>Entfernen</button>':'<button class="btn o" data-set style="flex:1;justify-content:center">Benzol melden und Ort wählen</button>'):'')+'</div>');
 d.addEventListener('click',e=>{const t=e.target;if(t.hasAttribute('data-x'))d.close();if(t.hasAttribute('data-rm')){S.chem=null;save();draw();d.close();}if(t.hasAttribute('data-set')){d.close();pickMode=ll=>{S.chem={sid:'benzol',lat:ll.lat,lng:ll.lng,large:true,fire:false};save();draw();toast('Gefahrstoff gemeldet. Zonen sind eingezeichnet.');};$('#map').style.cursor='crosshair';toast('Freisetzungsort auf der Karte antippen.');}
  if(t.id==='cl'){c.large=t.checked;save();draw();}if(t.id==='cf'){c.fire=t.checked;save();draw();}});}
/* ---- Lagebesprechung (Entwurf 4) ---- */
function meeting(){let step=1;const d=dlg('');const render=()=>{const us=S.units,inE=us.filter(u=>u.status==='einsatz'),bound=us.filter(u=>u.status!=='bereit').reduce((a,u)=>a+u.f+u.u+u.h,0),res=us.filter(u=>u.status==='bereit').reduce((a,u)=>a+u.f+u.u+u.h,0);
  const soon=us.filter(u=>{const l=S.logi[u.id];return l&&l.relief&&Date.parse(l.relief)-now()<30*60000;}),out=us.filter(u=>S.logi[u.id]&&S.logi[u.id].ausfall);
  let body='';const s=SUB.benzol,c=S.chem;
  if(step===1)body='<h2>Lage</h2><p class="sub">Das Wichtigste zuerst.</p><div class="kpi"><div style="--c:#b91c1c"><b>'+S.persons.sk1+'</b>SK I (rot)</div><div style="--c:#ca8a04"><b>'+S.persons.sk2+'</b>SK II (gelb)</div><div style="--c:#16a34a"><b>'+S.persons.sk3+'</b>SK III (grün)</div><div style="--c:#111827"><b>'+(S.persons.tot+S.persons.vermisst)+'</b>Tote und Vermisste</div></div><p>Wind aus '+S.wind.dir+' Grad, '+S.wind.speed+' m/s. '+(c?'Gefahrstoff '+s.name+' (UN '+s.un+') gemeldet.':'Kein Gefahrstoff gemeldet.')+'</p>';
  if(step===2)body='<h2>Kräfte</h2><p class="sub">Rot braucht eine Entscheidung.</p><div class="kpi"><div style="--c:#15803d"><b>'+inE.length+'</b>Einheiten im Einsatz</div><div style="--c:#15803d"><b>'+bound+'</b>Kräfte gebunden, '+res+' in Reserve</div><div style="--c:#c2410c"><b>'+soon.length+'</b>Ablösungen in 30 Minuten</div><div style="--c:#b91c1c"><b>'+out.length+'</b>Ausfälle</div></div><div style="background:#fff;border-radius:12px;overflow:auto"><table><thead><tr><th>Einheit</th><th>Abschnitt</th><th>Auftrag</th><th>Seit</th><th>Atemschutz</th><th>Ablösung</th></tr></thead><tbody>'+us.map(u=>{const l=S.logi[u.id]||{};const sc=S.sections.find(x=>x.id===u.sec);const rel=l.relief?Date.parse(l.relief)-now():null;
    return '<tr><td><b>'+esc(u.name)+'</b></td><td>'+(sc?esc(sc.name):'–')+'</td><td>'+esc(u.task||'–')+'</td><td>'+(l.since?dur(now()-Date.parse(l.since)):'–')+'</td><td>'+(l.agtN?'<span class="chip '+(l.agtMin>=40?'bad':'ok')+'">'+l.agtN+' Träger, '+l.agtMin+' min</span>':'–')+'</td><td>'+(l.ausfall?'<span class="chip bad">ausgefallen: '+esc(l.ausfall)+'</span>':rel!=null?'<span class="chip '+(rel<=0?'bad':rel<30*60000?'wa':'ok')+'">'+(rel<=0?'jetzt fällig':'in '+dur(rel))+'</span>':l.req?'<span class="chip in">'+esc(l.req)+(l.eta?', ETA '+hm(Date.parse(l.eta)):'')+'</span>':'–')+'</td></tr>';}).join('')+'</tbody></table></div>';
  if(step===3)body='<h2>Gefahren</h2>'+(c?'<div class="kpi"><div style="--c:#ef4444"><b>'+s.erg.a+' m</b>Absperrung</div><div style="--c:#ea580c"><b>'+s.erg.b+' m</b>Windrichtung'+(c.large?'':' (aus)')+'</div><div style="--c:#7c2d12"><b>'+s.erg.c+' m</b>Brandfall'+(c.fire?'':' (aus)')+'</div></div><p>'+s.name+': Flammpunkt '+s.flash+', Zündbereich '+s.ex+', Dampf '+s.vd+', '+s.h+'.</p>':'<p>Kein Gefahrstoff.</p>');
  if(step===4)body='<h2>Aufgaben</h2><p class="sub">Aufträge je Abschnitt und offene Nachforderungen.</p>'+S.sections.map(sc=>'<span class="lbl">'+esc(sc.name)+'</span>'+(S.units.filter(u=>u.sec===sc.id).map(u=>'<div class="chip gr" style="display:flex;margin:4px 0;white-space:normal;border-radius:10px">'+esc(u.name)+': '+esc(u.task||'kein Auftrag')+'</div>').join('')||'<div class="sub">keine Einheit</div>')).join('')+'<span class="lbl">Nachforderungen</span>'+(us.filter(u=>S.logi[u.id]&&S.logi[u.id].req).map(u=>'<div class="chip in" style="display:flex;margin:4px 0;border-radius:10px">'+esc(S.logi[u.id].req)+(S.logi[u.id].eta?', ETA '+hm(Date.parse(S.logi[u.id].eta)):'')+'</div>').join('')||'<div class="sub">keine</div>');
  if(step===5)body='<h2>Nächster Termin</h2><p class="sub">Uhrzeit der nächsten Lagebesprechung.</p><div class="grid2"><input type="time" id="nt" value="'+hm(now()+60*60000)+'"><div style="display:flex;gap:8px">'+[15,30,60].map(m=>'<button class="btn" data-m="'+m+'">+'+m+' min</button>').join('')+'</div></div>';
  $('.card',d).innerHTML='<div style="display:flex;gap:6px;padding:12px 16px;background:#fff;border-bottom:1px solid #d5dde8;flex-wrap:wrap">'+['1 Lage','2 Kräfte','3 Gefahren','4 Aufgaben','5 Termin'].map((t,i)=>'<button class="btn sm '+(i+1===step?'p':'')+'" data-s="'+(i+1)+'">'+t+'</button>').join('')+'</div><div class="bd">'+body+'</div><div class="ft"><button class="btn" data-b '+(step===1?'disabled':'')+'>Zurück</button><button class="btn p" data-n style="margin-left:auto;min-width:200px;justify-content:center">'+(step===5?'Fertig':'Weiter')+'</button></div>';};
 d.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.s)step=+t.dataset.s;else if(t.hasAttribute('data-n')){if(step===5){d.close();toast('Lagebesprechung beendet.');return;}step++;}else if(t.hasAttribute('data-b'))step--;else if(t.dataset.m){$('#nt',d).value=hm(now()+ +t.dataset.m*60000);return;}render();});render();}
setInterval(()=>{$('#clock').textContent=new Date().toLocaleString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});},1000);
chooser();window.__sim={get S(){return S;},get role(){return role;}};
})();
</script>
</body>
</html>
